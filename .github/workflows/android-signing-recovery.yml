name: Preserve Android signing identity
on:
  push:
    branches: [redesign]
    paths: [".github/workflows/android-signing-recovery.yml"]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: daymark-android-preview-signing-v1
          fail-on-cache-miss: true
      - name: Encrypt the existing key for private recovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import crypto from 'node:crypto';
          const key = crypto.randomBytes(32), iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const data = Buffer.concat([cipher.update(fs.readFileSync(os.homedir() + '/.android/debug.keystore')), cipher.final()]);
          const encryptedKey = crypto.publicEncrypt({key: fs.readFileSync('.github/android-signing-recovery-public.pem'), oaepHash: 'sha256'}, key);
          fs.writeFileSync('android-signing.encrypted.json', JSON.stringify(Object.fromEntries(Object.entries({key: encryptedKey, iv, tag: cipher.getAuthTag(), data}).map(([k,v]) => [k,v.toString('base64')]))));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-encrypted-recovery
          path: android-signing.encrypted.json
          retention-days: 7
