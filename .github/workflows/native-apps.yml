name: Native apps

on:
  push:
    branches: [redesign]
    paths: ["apps/**", "client/**", "scripts/android-*.py", ".github/workflows/native-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DAYMARK_KEYSTORE_FILE: ${{ github.workspace }}/.android-signing/daymark.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Build bundled offline interface
        run: npm run build --prefix client
        env:
          CI: "true"
          PUBLIC_URL: .
          REACT_APP_ROUTER: hash
          REACT_APP_API_URL: https://diploma-api-zozr.onrender.com/api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          mkdir -m 700 .android-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$DAYMARK_KEYSTORE_FILE"
          chmod 600 "$DAYMARK_KEYSTORE_FILE"
      - name: Build future update test fixture
        run: |
          gradle -p apps/android assembleRelease -PdaymarkVersionCode=4 -PdaymarkVersionName=0.3.1 --no-daemon
          mkdir -p apps/android/app/build/generated/upgradeFixture
          cp apps/android/app/build/outputs/apk/release/app-release.apk apps/android/app/build/generated/upgradeFixture/future.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/other-key.jks" -storepass only-for-tests -keypass only-for-tests -alias other -keyalg RSA -validity 1 -dname CN=Untrusted-Test
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/other-key.jks" --ks-pass pass:only-for-tests --out apps/android/app/build/generated/upgradeFixture/untrusted.apk apps/android/app/build/generated/upgradeFixture/future.apk
      - run: gradle -p apps/android testDebugUnitTest assembleRelease assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            python3 scripts/android-native-tests.py
            python3 scripts/android-upgrade-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Android-preview
          path: apps/android/app/build/outputs/apk/release/app-release.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$DAYMARK_KEYSTORE_FILE"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project apps/windows/ScheduleTests
      - run: dotnet publish apps/windows/Daymark -c Release -r win-x64 --self-contained true -o dist/windows
      - run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Daymark-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Windows-preview
          path: dist/Daymark-Windows-x64.zip
