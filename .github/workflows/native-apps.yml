name: Native apps

on:
  push:
    branches: [redesign]
    paths: ["apps/**", "client/**", ".github/workflows/native-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Build bundled offline interface
        run: npm run build --prefix client
        env:
          CI: "true"
          PUBLIC_URL: .
          REACT_APP_ROUTER: hash
          REACT_APP_API_URL: https://diploma-api-zozr.onrender.com/api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Reuse the preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: daymark-android-preview-signing-v1
      - run: gradle -p apps/android testDebugUnitTest assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle -p apps/android connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Android-preview
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project apps/windows/ScheduleTests
      - run: dotnet publish apps/windows/Daymark -c Release -r win-x64 --self-contained true -o dist/windows
      - run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Daymark-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Windows-preview
          path: dist/Daymark-Windows-x64.zip
