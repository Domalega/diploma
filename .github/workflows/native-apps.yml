name: Native apps

on:
  push:
    branches: [redesign]
    paths: ["apps/**", ".github/workflows/native-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p apps/android testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Android-preview
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project apps/windows/ScheduleTests
      - run: dotnet publish apps/windows/Daymark -c Release -r win-x64 --self-contained true -o dist/windows
      - run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Daymark-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Daymark-Windows-preview
          path: dist/Daymark-Windows-x64.zip
