<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link id="daymark-icon" rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/daymark-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#fcfcf9" />
    <meta name="color-scheme" content="light dark" />
    <script id="theme-init">
      // Apply the preference before rendering the page to avoid a light-theme flash.
      (function () {
        var preference = "system";
        var color = "green";
        try {
          var saved = localStorage.getItem("calendar.theme");
          if (["light", "dark", "system"].indexOf(saved) !== -1) preference = saved;
          var savedColor = localStorage.getItem("calendar.color");
          if (
            ["green", "blue", "purple", "rose", "orange", "monochrome"].indexOf(savedColor) !== -1
          )
            color = savedColor;
        } catch (error) {}
        var dark =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.color = color;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector("#daymark-icon")
          .setAttribute("href", "%PUBLIC_URL%/daymark-" + theme + ".svg");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#101a17" : "#fcfcf9");
        if (window.DaymarkAppearance) {
          window.DaymarkAppearance.postMessage(JSON.stringify({ theme: theme }));
        }
      })();
    </script>
    <title>Daymark — Personal calendar</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
